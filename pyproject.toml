[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "mimoagent"
dynamic = ["version"]
description = "MiMo Agent: an agent framework connecting coding agents, models, execution environments, datasets and reward"
readme = "README.md"
requires-python = "==3.12.*"
license = {file = "LICENSE.md"}
keywords = ["agents", "llm", "swe-bench", "code", "reinforcement-learning"]
authors = [
    {name = "Xiaomi MiMo Team"},
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]

dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "jinja2>=3.1.6",
    "openai==3.3.1",
    "anthropic==1.0.0",
    "tenacity>=9.1.4",
    "rich==15.*",
    "python-dotenv>=1.2.3",
    "typer==0.27.*",
    "platformdirs>=4.4.0",
    "kubernetes==36.0.3",
    "xxhash>=3.5.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
cube = [
    "cubesandbox==0.6.*",
]
modal = [
    "modal==1.5.*",
]
ray = [
    "ray>=2.40.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "pre-commit",
    "ruff",
]

[project.urls]
Repository = "https://github.com/XiaomiMiMo/mimoagent"
"Bug Tracker" = "https://github.com/XiaomiMiMo/mimoagent/issues"
Changelog = "https://github.com/XiaomiMiMo/mimoagent/blob/main/CHANGELOG.md"

[project.scripts]
mimoagent = "mimoagent.run.extra.batch:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "mimoagent.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mimoagent*"]

[tool.setuptools.package-data]
mimoagent = [
    "py.typed",
    "agents/mimocode/prompts/*.txt",
    "agents/codex/prompts/*.txt",
    "agents/blackbox/resources/*",
    "tools/mimocode/*.txt",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# I001: Isort, I002: required import
select = [
    # Error (E)
    "E",
    # Error (PLE)
    "PLE",
    # pycodestyle
    "E713",  # not in
    "E714",  # is not
    "E711",  # comparison with None
    # pyflakes
    "F821",
    "F822",
    "F401",  # unused-import
    "F841",  # unused var
    "F541",  # f-string without args
    "F901",  # raise NotImplemented should be raise NotImplementedError
    # isort
    "I001",  # isort
    "I002",  # required import
    # pyupgrade and related
    "UP",    # pyupgrade
    "C401",  # flake8-comprehensions: unnecessary-generator-set
    "C402",  # flake8-comprehensions: unnecessary-generator-dict
    "C403",  # flake8-comprehensions: unnecessary-list-comprehension-set
    "C404",  # flake8-comprehensions: unnecessary-list-comprehension-dict
    "C405",  # flake8-comprehensions: unnecessary-literal-set
    "F632",  # pyflakes: is-literal
    "W605",  # pycodestyle: invalid-escape-sequence
    # bugbear
    "B006",  # mutable default
    "B007",  # unused loop var
    "B009",  # getattr with constant
    # flake8-errmsg
    "EM",
    # flake8-return
    "RET",
    # RUF
    "RUF019",  # unneded key in dict check
    # pytest
    "PT",
    # flake8-simplify (SIM)
    "SIM201",
    # flake8-use-pathlib
    "PTH100",
    "PTH110",
    "PTH111",
    "PTH112",
    "PTH113",
    "PTH114",
    "PTH117",
    "PTH118",
    "PTH119",
    "PTH120",
    "PTH121",
    "PTH122",
    "PTH202",
    "PTH203",
    "PTH204",
    "PTH205",
]
ignore = [
    # flake8-return
    "RET505",  # can't autofix
    "RET506",  # can't autofix
    "RET507",  # can't autofix
    # error (E)
    "E501",    # line too long
    "E402",    # import not on top of file
    "E722",    # bare except
    "E741",    # ambiguous symbol
    # pytest
    "PT011",
    "PT018",
    # flake8-errmsg
    "EM101",   # exception must not use a string literal
    "EM102",   # exception must not use an f-string literal
    "EM103",   # exception must not use a .format(...) string directly
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# These modules build POSIX path strings for *remote* filesystems (pods,
# sandboxes, containers) or shell commands, where pathlib's host semantics do
# not apply; the pathlib rules stay on for everything else.
"src/mimoagent/environments/kubernetes.py" = ["PTH"]
"src/mimoagent/environments/cube.py" = ["PTH"]
"src/mimoagent/environments/modal.py" = ["PTH"]
"src/mimoagent/environments/docker.py" = ["PTH"]
"src/mimoagent/environments/local.py" = ["PTH"]
"src/mimoagent/environments/datasets/*.py" = ["PTH"]
"src/mimoagent/tools/edit.py" = ["PTH"]
"src/mimoagent/tools/cc/edit.py" = ["PTH"]
"tests/environments/test_cube.py" = ["PTH"]
"tests/environments/test_modal.py" = ["PTH"]
"scripts/*.py" = ["PTH"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
    "integration: needs an external service (docker daemon, CubeSandbox, Modal, network); deselect with '-m \"not integration\"'",
]
