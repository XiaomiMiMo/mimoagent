# Run Pi as a blackbox scaffold inside the task pod. Installs as a standalone
# binary from the internal CDN (no node/npm needed in the image).
# ``api: anthropic-messages`` is required for thinking-signature replay
# (pi.dev docs: model compatibility).
use_dataset_env: true

agent:
  type: pi
  version: 0.83.0
  api: anthropic-messages
  adaptive_thinking: true # thinking.type=adaptive + output_config.effort
  thinking: max           # effort with adaptive_thinking; budget level without
  context_window: 1000000 # a claude-opus-4-8 gateway channel serving a 1M context
  max_tokens: 65536       # thinking tokens count in
  # thinking_budgets:     # budget mode only
  #   high: 32768
  # skip_install: false

# Environment configuration
environment:
  cwd: "/testbed"
  timeout: 600
  cpu_request: "2"
  cpu_limit: "4"
  memory_request: "8Gi"
  memory_limit: "16Gi"
  environment_class: kubernetes
  # Forward an egress proxy into the environment when your cluster needs one:
  # env:
  #   HTTP_PROXY: http://proxy.example.com:3128
  #   HTTPS_PROXY: http://proxy.example.com:3128
  #   NO_PROXY: localhost,127.0.0.1,.svc.cluster.local

model:
  model_name: "claude-opus-4-8"
  model_kwargs:
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    api_key: "${ANTHROPIC_API_KEY:-}"
