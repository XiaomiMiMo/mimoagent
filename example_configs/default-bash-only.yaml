# Bash-only variant of the default agent profile.
#
# The lifecycle and prompts match swe.yaml; only the tool surface is reduced to
# the dedicated bash-only implementation.
# ``bashonly-agent`` selects this native harness; the model still sees the tool as ``bash``.
use_dataset_env: true

agent:
  type: bashonly-agent

  tools:
    - tool: "bash-only"
      config:
        timeout: 60
        max_timeout: 300

  system_template: |
    You are an agent, your current working directory is {{cwd}}.

    You can use the tools available to you to interact with the computer to assist the user in completing tasks.

  instance_template: |
    Fix the following issue:

    {{task}}

  step_limit: 500

  # Runtime anti-reward-hacking guard (agents/antihack.py). Default off;
  # enable per-run. Patterns can be overridden here as lists.
  # antihack:
  #   enabled: true

environment:
  cwd: "/testbed"
  timeout: 300
  environment_class: kubernetes

model:
  model_name: "${MIMOAGENT_MODEL_NAME:-gpt-5}"
  protocol: "chat"
  model_kwargs:
    base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${OPENAI_API_KEY:-}"
    temperature: 1.0
