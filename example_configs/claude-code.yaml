# Run the third-party Claude Code scaffold as the agent, instead of the native
# mimoagent tool-calling loop. Selected purely by ``agent.type: claude-code``.
#
# Claude Code runs *inside the test pod* via the Claude Agent SDK and edits the
# repo in-place; mimoagent grades the result exactly as it does for the native
# agent (``git diff HEAD`` in ``cwd`` → calculate_reward). Auth/model routing is
# taken from the shared ``model:`` block below — one config drives both.
#
# Run:
#   python src/mimoagent/run/extra/batch.py \
#       --output outputs/cc-test \
#       --config example_configs/claude-code.yaml \
#       --workers 4 --slice 0:4 \
#       --dataset princeton-nlp/SWE-bench_Verified --split test
use_dataset_env: true

agent:
  type: claude-code
  # cwd defaults to the environment's working dir (/testbed below).
  effort: high          # low | medium | high | max
  max_turns: 200
  # skip_install: false # set true if the image already has the SDK baked in
  # debug: true         # SDK debug stream, copied out as claude-code-debug.log
  # run_timeout: 18000  # the session runs detached from the exec websocket, so it may exceed the 4h connection cap
  # stall_timeout: 1800 # kill the session after this many seconds without a write to claude-code.txt (0 = off)

environment:
  cwd: "/testbed"
  timeout: 300
  cpu_request: "2"
  memory_request: "8Gi"
  environment_class: kubernetes

# Claude Code authenticates / routes through this same block.
model:
  model_name: "claude-opus-4-7"
  model_kwargs:
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    api_key: "${ANTHROPIC_API_KEY:-}"
