# Run Oh My Pi (17.3.4 pinned, wire behaviour re-verified on it) as a MiMo Agent harness, selected by
# ``agent.type: omp``. Community fork of Pi (see pi.yaml for upstream)
# compiled to a single bun binary; the externalized pi_natives .node files
# ship in the payload and are staged into $HOME/.omp/natives/. Pi-style
# ``--mode json`` events land in ``omp.txt``.
#
# Verified against an Anthropic-compatible gateway serving claude-opus-5: thinking.mode
# anthropic-adaptive + output_config.effort, signature replay, cache hits.
# The provider is pinned to ``auth: apiKey`` — without it omp impersonates
# Claude Code on custom anthropic-messages providers.
use_dataset_env: true

agent:
  type: omp
  version: 17.3.4
  thinking: xhigh         # off|minimal|low|medium|high|xhigh|max|auto
  context_limit: 1000000
  output_limit: 65536
  # thinking_mode: anthropic-adaptive  # or "budget" + thinking_budgets
  # tools: "read,bash,edit,write,grep,glob,todo,task,web_search"  # default (full set)
  # context_management: false  # default. true re-adds the clear_thinking beta
  #                            # field — an Anthropic-native route takes it, a
  #                            # Bedrock-backed one 400s the whole request
  # tool_strict: false         # default. same story for `strict: true` on the
  #                            # edit tool definition
  # skip_install: false

environment:
  cwd: "/testbed"
  timeout: 300
  environment_class: kubernetes

model:
  model_name: "claude-opus-5"
  model_kwargs:
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    api_key: "${ANTHROPIC_API_KEY:-}"
