# Run MiMo-Code (rebuilt 0.1.12 pinned) as a MiMo Agent harness, selected by
# ``agent.type: mimocode``. It runs inside the test pod, edits the repo
# in-place, and its NDJSON event stream is copied out to ``mimocode.txt``;
# grading is the usual ``git diff HEAD`` → calculate_reward.
#
# Run:
#   python src/mimoagent/run/extra/batch.py \
#       --output outputs/mimocode-test \
#       --config example_configs/mimocode.yaml \
#       --workers 4 --slice 0:4 \
#       --dataset princeton-nlp/SWE-bench_Verified --split test
use_dataset_env: true

agent:
  type: mimocode
  # cwd defaults to the environment's working dir (/testbed below).
  thinking_effort: max    # thinking.type=adaptive + output_config.effort
  context_limit: 1000000  # a claude-opus-4-8 gateway channel serving a 1M context
  output_limit: 65536     # mimo requires context/output together
  # version: 0.1.12       # CDN asset to install
  # protocol: anthropic   # anthropic | completions | responses
  # thinking_budget: 8192 # budget mode, mutually exclusive with thinking_effort
  # max_turns: 500        # agent.<primary>.steps; unset = upstream default (unlimited)
  # extra_env:
  #   MIMOCODE_CODEX_MODE: "true"   # harness default is "false"
  #   MIMOCODE_RL_MODE: "false"     # on by default; false restores interactive behaviour
  # skip_install: false

environment:
  cwd: "/testbed"
  timeout: 300
  cpu_request: "2"
  memory_request: "8Gi"
  environment_class: kubernetes

model:
  model_name: "claude-opus-4-8"
  model_kwargs:
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    api_key: "${ANTHROPIC_API_KEY:-}"
