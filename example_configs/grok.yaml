# Run xAI Grok Build (1.0.4 pinned, wire behaviour re-verified on it) as a MiMo Agent harness, selected by
# ``agent.type: grok``. Single static binary payload (no runtime deps at all);
# it runs headless (--yolo) inside the test pod against the gateway's
# /v1/messages and its streaming-json event log is copied out to ``grok.txt``.
#
# Verified against an Anthropic-compatible gateway serving claude-opus-5 (1.0.4): adaptive
# thinking + output_config.effort on the wire, thinking signatures replay,
# prompt caching hits, one request per model step. NOTE the effort ceiling is
# xhigh and it now reaches the wire as "xhigh" — 0.2.106 rewrote it to "max",
# 1.0.4 does not, so ``effort: max`` folds to xhigh (logged) and this arm runs
# one effort level below the others.
use_dataset_env: true

agent:
  type: grok
  version: 1.0.4
  effort: xhigh           # low | medium | high | xhigh; "max" folds to xhigh
                          # (1.0.4's CLI has no max) with a warning
  context_limit: 1000000  # auto-compaction baseline
  output_limit: 65536     # request max_tokens (grok's own unset default is 128000)
  # max_turns: 2000       # unlimited when unset
  # disallowed_tools: null  # default: nothing dropped (25 on the wire). grok
  #                       # answers ask_user_question itself in headless mode
  #                       # ("no user is available, continue with your best
  #                       # judgment", 0.004s), so it costs nothing to keep.
  #                       # Auxiliary title/summary roles are still routed to a
  #                       # dead port so they never reach the gateway.
  # skip_install: false   # true when the image pre-bakes /opt/mimo-grok

environment:
  cwd: "/testbed"
  timeout: 300
  environment_class: kubernetes

model:
  model_name: "claude-opus-5"
  model_kwargs:
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    api_key: "${ANTHROPIC_API_KEY:-}"
